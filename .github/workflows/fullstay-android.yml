name: FullStay Android build

# Builds FullStay.apk from the android/ folder on GitHub's machines and runs its tests first.
# Start it from the Actions tab ("Run workflow"). The APK is attached to the run as an artifact.
#
# Secrets (repository Settings > Secrets and variables > Actions):
#   FULLSTAY_KEY            the same value as FS_KEY on Cloudflare (shared with the iOS build)
#   ANDROID_SIGNING_KEYSTORE optional: your debug.keystore as base64, so new builds install over the
#                            FullStay already on your phones. Without it, every build gets a new signature
#                            and you must uninstall the old FullStay before installing a new build.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build FullStay.apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Use your signing key (if set)
        env:
          KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
            echo "Using your keystore: new builds install over the existing FullStay."
          else
            echo "::warning::No ANDROID_SIGNING_KEYSTORE secret: this APK has a new signature. Uninstall the old FullStay before installing it."
          fi

      - name: Check the rovwf.com key
        env:
          FULLSTAY_KEY: ${{ secrets.FULLSTAY_KEY }}
        run: |
          if [ -z "$FULLSTAY_KEY" ]; then
            echo "::warning::No FULLSTAY_KEY secret: building without the rovwf.com remote switch."
          elif ! printf '%s' "$FULLSTAY_KEY" | grep -Eq '^[A-Za-z0-9_-]{24,}$'; then
            echo "::error::FULLSTAY_KEY must be 24+ characters: letters, numbers, - and _ only."
            exit 1
          fi

      - name: Run the tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Build the APK
        env:
          FULLSTAY_KEY: ${{ secrets.FULLSTAY_KEY }}
        run: |
          ./gradlew --no-daemon assembleRelease "-PfullstayKey=$FULLSTAY_KEY"
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/FullStay.apk

      - name: Upload FullStay.apk
        uses: actions/upload-artifact@v4
        with:
          name: FullStay.apk
          path: dist/FullStay.apk
          if-no-files-found: error

      - name: Upload test report (when tests fail)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
